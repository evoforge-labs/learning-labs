<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Một câu hỏi, nhiều nhánh</title>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #faf9f7;
      --color-ink:    #1c1917;
      --color-muted:  #57534e;
      --color-accent: #0f766e;
      --font-sans:    'Be Vietnam Pro', ui-sans-serif, system-ui, sans-serif;
      --font-serif:   'Spectral', Georgia, serif;
      --font-mono:    ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 0.5rem;
    }
    .sub { font-family: var(--font-serif); font-style: italic; font-size: 0.95rem; color: var(--color-muted); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Dependency graph · Diagram Design</p>
    <h1>Một câu hỏi, nhiều nhánh</h1>
    <p class="sub">Cây buộc mỗi node có đúng một cha. Đây là thứ cây không biểu diễn được.</p>

    <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="philmap-cross-title philmap-cross-desc">
      <title id="philmap-cross-title">Một câu hỏi, nhiều nhánh</title>
      <desc id="philmap-cross-desc">Hai câu hỏi triết học xuyên nhánh — tự do ý chí và hố là/nên — mỗi câu cần nhiều lĩnh vực khác nhau mới trả lời được; đạo đức học là lĩnh vực mà cả hai câu cùng đi qua.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f766e"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9333ea"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf9f7"/>

      <!-- rank labels -->
      <text x="40" y="128" fill="#78716c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">CÂU HỎI</text>
      <text x="40" y="248" fill="#78716c" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">LĨNH VỰC</text>

      <!-- ===== connectors (drawn before boxes) ===== -->
      <!-- C1 Tự do ý chí -> F1 Siêu hình học (left, my=192) -->
      <path d="M 364 152 L 364 160 Q 364 168 356 168 L 178 168 Q 170 168 170 176 L 170 216" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- C1 -> F2 Tâm thức (left, my=176) -->
      <path d="M 400 152 L 400 176 Q 400 184 392 184 L 342 184 Q 334 184 334 192 L 334 216" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- C1 -> F3 Pháp luật (right, my=176) -->
      <path d="M 436 152 L 436 176 Q 436 184 444 184 L 490 184 Q 498 184 498 192 L 498 216" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- C1 -> F4 Đạo đức học (right, my=192, attach 640) -->
      <path d="M 472 152 L 472 160 Q 472 168 480 168 L 632 168 Q 640 168 640 176 L 640 216" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- C2 Hố là/nên -> F4 Đạo đức học (left, my=184, attach 684) -->
      <path d="M 716 152 L 716 160 Q 716 168 708 168 L 692 168 Q 684 168 684 176 L 684 216" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- C2 -> F5 Nhận thức luận (right, my=184) -->
      <path d="M 776 152 L 776 176 Q 776 184 784 184 L 818 184 Q 826 184 826 192 L 826 216" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- ===== rank 0: câu hỏi xuyên nhánh ===== -->
      <!-- C1 -->
      <rect x="328" y="96" width="180" height="56" rx="6" fill="#faf9f7"/>
      <rect x="328" y="96" width="180" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="336" y="102" width="48" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="360" y="111" fill="rgba(28,25,23,0.8)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">CÂU HỎI</text>
      <rect x="468" y="102" width="32" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.30)" stroke-width="0.8"/>
      <text x="484" y="111" fill="#78716c" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">0 in</text>
      <text x="418" y="133" fill="#1c1917" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">Tự do ý chí</text>
      <text x="418" y="146" fill="#57534e" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">4 nhánh</text>

      <!-- C2 -->
      <rect x="656" y="96" width="180" height="56" rx="6" fill="#faf9f7"/>
      <rect x="656" y="96" width="180" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="664" y="102" width="48" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="688" y="111" fill="rgba(28,25,23,0.8)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">CÂU HỎI</text>
      <rect x="796" y="102" width="32" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.30)" stroke-width="0.8"/>
      <text x="812" y="111" fill="#78716c" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">0 in</text>
      <text x="746" y="133" fill="#1c1917" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">Hố là/nên</text>
      <text x="746" y="146" fill="#57534e" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">2 nhánh</text>

      <!-- ===== rank 1: lĩnh vực ===== -->
      <!-- F1 -->
      <rect x="100" y="216" width="140" height="56" rx="6" fill="#faf9f7"/>
      <rect x="100" y="216" width="140" height="56" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
      <rect x="196" y="222" width="32" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.30)" stroke-width="0.8"/>
      <text x="212" y="231" fill="#78716c" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">1 in</text>
      <text x="170" y="253" fill="#1c1917" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">Siêu hình học</text>

      <!-- F2 -->
      <rect x="264" y="216" width="140" height="56" rx="6" fill="#faf9f7"/>
      <rect x="264" y="216" width="140" height="56" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
      <rect x="360" y="222" width="32" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.30)" stroke-width="0.8"/>
      <text x="376" y="231" fill="#78716c" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">1 in</text>
      <text x="334" y="253" fill="#1c1917" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">Tâm thức</text>

      <!-- F3 -->
      <rect x="428" y="216" width="140" height="56" rx="6" fill="#faf9f7"/>
      <rect x="428" y="216" width="140" height="56" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
      <rect x="524" y="222" width="32" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.30)" stroke-width="0.8"/>
      <text x="540" y="231" fill="#78716c" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">1 in</text>
      <text x="498" y="253" fill="#1c1917" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">Pháp luật</text>

      <!-- F4 focal -->
      <rect x="592" y="216" width="140" height="56" rx="6" fill="#faf9f7"/>
      <rect x="592" y="216" width="140" height="56" rx="6" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1"/>
      <rect x="688" y="222" width="32" height="12" rx="2" fill="transparent" stroke="rgba(15,118,110,0.50)" stroke-width="0.8"/>
      <text x="704" y="231" fill="#0f766e" font-size="7" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">2 in</text>
      <text x="662" y="253" fill="#1c1917" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">Đạo đức học</text>

      <!-- F5 -->
      <rect x="756" y="216" width="140" height="56" rx="6" fill="#faf9f7"/>
      <rect x="756" y="216" width="140" height="56" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
      <rect x="852" y="222" width="32" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.30)" stroke-width="0.8"/>
      <text x="868" y="231" fill="#78716c" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">1 in</text>
      <text x="826" y="253" fill="#1c1917" font-size="12" font-weight="600" font-family="'Be Vietnam Pro', sans-serif" text-anchor="middle">Nhận thức luận</text>

      <!-- ===== legend ===== -->
      <line x1="40" y1="320" x2="960" y2="320" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <text x="40" y="340" fill="#57534e" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="332" width="16" height="10" rx="2" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <text x="144" y="340" fill="#57534e" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">câu hỏi xuyên nhánh</text>
      <rect x="300" y="332" width="16" height="10" rx="2" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
      <text x="324" y="340" fill="#57534e" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">lĩnh vực</text>
      <rect x="420" y="332" width="16" height="10" rx="2" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1"/>
      <text x="444" y="340" fill="#57534e" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">fan-in cao nhất</text>
      <line x1="592" y1="337" x2="620" y2="337" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="632" y="340" fill="#57534e" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cần để trả lời</text>
    </svg>
  </div>
</body>
</html>
